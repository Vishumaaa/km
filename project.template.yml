# TEMPLATE for the Xcode project. Don't run xcodegen on this directly:
# run ./scripts/setup.sh, which fills in your bundle ID prefix and Apple Team ID,
# writes project.yml (git-ignored), and generates Glide.xcodeproj.
name: Glide

options:
  bundleIdPrefix: com.example      # replaced by setup.sh
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""           # replaced by setup.sh
    CODE_SIGN_STYLE: Automatic

packages:
  GlideKit:
    path: Packages/GlideKit

targets:
  Glide:
    type: application
    platform: iOS
    sources: [iOS/Glide]
    dependencies:
      - package: GlideKit
        product: GlideCore
      - package: GlideKit
        product: GlideNet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.glide
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
    info:
      path: iOS/Glide/Info.plist
      properties:
        CFBundleDisplayName: Glide
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: Glide connects to the Glide app on your Mac over your local network to control its pointer.
        NSBonjourServices:
          - _glide._tcp

  GlideMac:
    type: application
    platform: macOS
    sources: [Mac/GlideMac]
    dependencies:
      - package: GlideKit
        product: GlideCore
      - package: GlideKit
        product: GlideNet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.glide.mac
        PRODUCT_NAME: Glide
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
    entitlements:
      path: Mac/GlideMac/GlideMac.entitlements
      properties:
        # Posting synthetic input requires Accessibility, which can't be sandboxed.
        com.apple.security.app-sandbox: false
    info:
      path: Mac/GlideMac/Info.plist
      properties:
        CFBundleDisplayName: Glide
        LSUIElement: true            # menu-bar only, no Dock icon
        NSLocalNetworkUsageDescription: Glide accepts connections from your iPhone on your local network.
        NSBonjourServices:
          - _glide._tcp
